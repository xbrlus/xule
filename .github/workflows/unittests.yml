name: Run XULE Unit Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or ref to run against. Leave empty for the branch/ref that triggered the run.'
        required: false
        default: ''
        type: string
      xule_file:
        description: 'Comma-separated XULE source file name(s) in unitTests/source/base whose rules should be run (e.g. boolean or boolean.xule). Leave empty to run every rule in the compiled ruleset.'
        required: false
        default: ''
        type: string

jobs:
  run-unit-tests:
    name: Compile and run base unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Arelle and dependencies
        run: |
          pip install --no-cache-dir \
            lxml==5.2.2 \
            isodate==0.6.1 \
            aniso8601==9.0.1 \
            holidays==0.52 \
            pytz \
            regex \
            tabulate \
            NumPy==1.26.2 \
            pyparsing==3.1.2 \
            Arelle-release

      - name: Install XULE plugin from this checkout
        run: |
          set -euo pipefail
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          mkdir -p "$SITE_PACKAGES/arelle/plugin"
          cp -r plugin/xule "$SITE_PACKAGES/arelle/plugin/xule"
          cp plugin/semanticHash.py "$SITE_PACKAGES/arelle/plugin/semanticHash.py"

      - name: Install validate and transform plugins from Arelle GitHub repository
        run: |
          set -euo pipefail
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          EDGAR_SRC=$(mktemp -d)
          git clone --depth 1 https://github.com/Arelle/EDGAR.git "$EDGAR_SRC"
          rm -rf "$SITE_PACKAGES/arelle/plugin/EDGAR"
          cp -r "$EDGAR_SRC" "$SITE_PACKAGES/arelle/plugin/EDGAR"
          rm -rf "$SITE_PACKAGES/arelle/plugin/EDGAR/.git"
          rm -rf "$EDGAR_SRC"

      - name: Determine files and rules to run
        id: rules
        env:
          XULE_FILE: ${{ inputs.xule_file }}
        run: |
          set -euo pipefail
          # constants.xule is required too: resources.xule (one of the files
          # below) references constants (e.g. NON_NEG_ITEMS) defined there,
          # so compiling resources.xule without it fails.
          ALWAYS_INCLUDE=(base-taxonomy-2020.xule constants.xule functions.xule namespace.xule resources.xule)
          if [ -z "$XULE_FILE" ]; then
            echo "run_only=" >> "$GITHUB_OUTPUT"
            echo "compile_target=unitTests/source/base" >> "$GITHUB_OUTPUT"
            echo "expected_files=" >> "$GITHUB_OUTPUT"
            echo "No file specified, running every rule in the compiled ruleset"
          else
            declare -A SEEN_COMPILE_FILES=()
            RULES=""
            EXPECTED_FILES=""
            COMPILE_FILES=""

            add_compile_file() {
              local fname="$1"
              if [ -n "${SEEN_COMPILE_FILES[$fname]:-}" ]; then
                return
              fi
              SEEN_COMPILE_FILES[$fname]=1
              if [ -z "$COMPILE_FILES" ]; then
                COMPILE_FILES="unitTests/source/base/$fname"
              else
                COMPILE_FILES="$COMPILE_FILES|unitTests/source/base/$fname"
              fi
            }

            IFS=',' read -ra FILES <<< "$XULE_FILE"
            for f in "${FILES[@]}"; do
              f="$(echo "$f" | xargs)"
              [ -z "$f" ] && continue
              case "$f" in
                *.xule) FNAME="$f" ;;
                *) FNAME="$f.xule" ;;
              esac
              SOURCE_FILE="unitTests/source/base/$FNAME"
              if [ ! -f "$SOURCE_FILE" ]; then
                echo "::error::No such XULE source file: $SOURCE_FILE"
                exit 1
              fi
              FILE_RULES=$(grep -oE '^output [A-Za-z0-9_]+' "$SOURCE_FILE" | awk '{print $2}' | paste -sd, -)
              if [ -z "$FILE_RULES" ]; then
                echo "::error::No 'output' rules found in $SOURCE_FILE"
                exit 1
              fi
              if [ -z "$RULES" ]; then
                RULES="$FILE_RULES"
              else
                RULES="$RULES,$FILE_RULES"
              fi
              if [ -z "$EXPECTED_FILES" ]; then
                EXPECTED_FILES="$FNAME"
              else
                EXPECTED_FILES="$EXPECTED_FILES,$FNAME"
              fi
              add_compile_file "$FNAME"
            done

            for a in "${ALWAYS_INCLUDE[@]}"; do
              add_compile_file "$a"
            done

            echo "run_only=$RULES" >> "$GITHUB_OUTPUT"
            echo "compile_target=$COMPILE_FILES" >> "$GITHUB_OUTPUT"
            echo "expected_files=$EXPECTED_FILES" >> "$GITHUB_OUTPUT"
            echo "Running only: $RULES"
            echo "Compiling: $COMPILE_FILES"
          fi

      - name: Build expected results from XULE source
        run: |
          set -euo pipefail
          mkdir -p unitTests/output
          EXPECTED_FILES="${{ steps.rules.outputs.expected_files }}"
          ARGS=(--source-dir unitTests/source/base
                --out "unitTests/output/expected-${RUN_ID}.csv")
          if [ -n "$EXPECTED_FILES" ]; then
            IFS=',' read -ra FILE_ARGS <<< "$EXPECTED_FILES"
            ARGS+=(--files "${FILE_ARGS[@]}")
          fi
          python3 unitTests/commands/xule_test_report.py extract "${ARGS[@]}"

      - name: Compile base unit test ruleset
        run: |
          mkdir -p unitTests/compiled
          python -m arelle.CntlrCmdLine \
            --xule-compile "${{ steps.rules.outputs.compile_target }}" \
            --plugins "xule" \
            --xule-rule-set "unitTests/compiled/ut-ruleset-${RUN_ID}.zip" \
            --xule-max-recurse-depth=2500

      - name: Run XULE unit tests
        run: |
          set -euo pipefail
          mkdir -p unitTests/output
          ARGS=(--plugins 'xule|EDGAR/transform|validate/EFM|inlineXbrlDocumentSet'
                --xule-run
                --noCertificateCheck
                --httpUserAgent "XBRL US XULE Unit Tests dqc@xbrl.us"
                --xule-rule-set "unitTests/compiled/ut-ruleset-${RUN_ID}.zip"
                --logNoRefObjectProperties
                --logFormat "[%(messageCode)s] %(message)s")
          RUN_ONLY="${{ steps.rules.outputs.run_only }}"
          if [ -n "$RUN_ONLY" ]; then
            ARGS+=(--xule-run-only "$RUN_ONLY")
          fi
          python -m arelle.CntlrCmdLine "${ARGS[@]}" > "unitTests/output/output-${RUN_ID}.txt"

      - name: Clean noise from output
        run: |
          grep -E -v "(ix11.11.1.2:invalidTransformation|ix11.10.1.2:invalidTransformation|xmlSchema:syntax|html:syntaxError|Activation of plug|Xule version:|Instance Loaded.|Taxonomy Loaded.)" \
            "unitTests/output/output-${RUN_ID}.txt" > unitTests/output/output.tmp.txt \
            && mv unitTests/output/output.tmp.txt "unitTests/output/output-${RUN_ID}.txt"

      - name: Compare results against expected values
        if: always()
        run: |
          python3 unitTests/commands/xule_test_report.py compare \
            --expected "unitTests/output/expected-${RUN_ID}.csv" \
            --output "unitTests/output/output-${RUN_ID}.txt" \
            --csv "unitTests/output/mismatches-${RUN_ID}.csv"

      - name: Upload output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: |
            unitTests/output/output-${{ github.run_id }}.txt
            unitTests/output/expected-${{ github.run_id }}.csv
            unitTests/output/mismatches-${{ github.run_id }}.csv
            unitTests/compiled/ut-ruleset-${{ github.run_id }}.zip
          retention-days: 30